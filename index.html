<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sahil Music</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08080b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 56px;
      margin: 0;
    }

    h1 span {
      color: #a78bfa;
    }

    p {
      color: #999;
      font-size: 18px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Sahil <span>Music</span></h1>
    <p>Music discovery starts here 🎵</p>
  </div>

</body>
</html>
