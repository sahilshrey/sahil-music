<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#08080b">
  <meta name="description" content="Sahil Music — Discover songs, artists and albums.">

  <title>Sahil Music</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #08080b;
      color: white;
      min-height: 100vh;
    }

    /* ---------- HEADER ---------- */

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #222228;
      background: rgba(8, 8, 11, 0.92);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(15px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      text-decoration: none;
      color: white;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 18px;
    }

    .logo span {
      color: #a78bfa;
    }

    .apple-btn {
      text-decoration: none;
      color: #ddd;
      border: 1px solid #303038;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 13px;
      transition: 0.2s;
    }

    .apple-btn:hover {
      border-color: #8b5cf6;
      color: white;
    }


    /* ---------- HERO ---------- */

    .hero {
      max-width: 1200px;
      margin: auto;
      min-height: 430px;
      padding: 70px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      overflow: hidden;
    }

    .hero-content {
      max-width: 700px;
      z-index: 2;
    }

    .eyebrow {
      color: #a78bfa;
      font-size: 11px;
      letter-spacing: 4px;
      font-weight: bold;
      margin-bottom: 17px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 86px);
      line-height: 0.95;
      letter-spacing: -5px;
    }

    h1 span {
      background: linear-gradient(
        90deg,
        #a78bfa,
        #ec4899
      );
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #9999a3;
      margin-top: 25px;
      font-size: 16px;
      line-height: 1.6;
      max-width: 530px;
    }


    /* ---------- SEARCH ---------- */

    .search-box {
      margin-top: 30px;
      width: 100%;
      max-width: 650px;
      height: 58px;
      display: flex;
      align-items: center;
      padding: 5px;
      border: 1px solid #303038;
      border-radius: 16px;
      background: #121216;
      transition: 0.2s;
    }

    .search-box:focus-within {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .search-icon {
      font-size: 21px;
      color: #777;
      margin-left: 14px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 0 14px;
      font-size: 15px;
    }

    #searchInput::placeholder {
      color: #66666f;
    }

    #searchButton {
      height: 46px;
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #08080b;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #e9e9e9;
    }


    /* ---------- DECORATION ---------- */

    .disc {
      width: 290px;
      height: 290px;
      flex-shrink: 0;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle,
          #09090b 0px,
          #09090b 4px,
          #1c1c21 5px,
          #1c1c21 8px
        );
      border: 18px solid #141419;
      box-shadow:
        0 0 80px rgba(139, 92, 246, 0.35),
        0 30px 80px #000;
      position: relative;
      animation: rotate 18s linear infinite;
    }

    .disc::after {
      content: "";
      position: absolute;
      width: 55px;
      height: 55px;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      border: 10px solid #101014;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* ---------- CONTENT ---------- */

    .content {
      max-width: 1200px;
      margin: auto;
      padding: 20px 6% 100px;
    }

    .section-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 28px;
      letter-spacing: -1px;
    }

    #resultCount {
      color: #66666f;
      font-size: 13px;
    }


    /* ---------- CHIPS ---------- */

    .chips {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 20px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      white-space: nowrap;
      padding: 9px 15px;
      border-radius: 30px;
      border: 1px solid #2b2b31;
      background: #111115;
      color: #aaa;
      cursor: pointer;
    }

    .chip:hover,
    .chip.active {
      background: #281c39;
      border-color: #8b5cf6;
      color: white;
    }


    /* ---------- SONG GRID ---------- */

    #loading {
      text-align: center;
      color: #888;
      padding: 50px;
      display: none;
    }

    #message {
      text-align: center;
      color: #888;
      padding: 50px 20px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }

    .song-card {
      background: #111115;
      border: 1px solid #202027;
      border-radius: 15px;
      overflow: hidden;
      transition: 0.25s;
    }

    .song-card:hover {
      transform: translateY(-5px);
      border-color: #393040;
      background: #15151a;
    }

    .album-art {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #1b1b20;
    }

    .song-info {
      padding: 13px;
    }

    .song-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      margin-top: 6px;
      color: #9999a3;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .genre {
      margin-top: 8px;
      color: #66666f;
      font-size: 10px;
    }

    .play-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      cursor: pointer;
      font-size: 16px;
      position: absolute;
      right: 10px;
      bottom: 10px;
      box-shadow: 0 8px 20px #000;
    }

    .art-container {
      position: relative;
    }


    /* ---------- PLAYER ---------- */

    #player {
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      display: none;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      border: 1px solid #37323f;
      border-radius: 16px;
      background: rgba(20, 20, 25, 0.94);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 70px #000;
    }

    #player.show {
      display: flex;
    }

    #player img {
      width: 50px;
      height: 50px;
      border-radius: 9px;
      object-fit: cover;
    }

    .player-details {
      min-width: 130px;
    }

    .player-title {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      color: #888;
      font-size: 11px;
      margin-top: 4px;
    }

    #audioPlayer {
      flex: 1;
      min-width: 150px;
    }

    #closePlayer {
      border: none;
      background: none;
      color: #aaa;
      font-size: 23px;
      cursor: pointer;
    }


    /* ---------- FOOTER ---------- */

    footer {
      max-width: 1200px;
      margin: auto;
      border-top: 1px solid #202027;
      padding: 25px 6%;
      display: flex;
      justify-content: space-between;
      color: #555;
      font-size: 11px;
    }


    /* ---------- MOBILE ---------- */

    @media (max-width: 950px) {

      .song-grid {
        grid-template-columns: repeat(3, 1fr);
